name: Jellycat Tracker

on:
  # GitHub's scheduler is best-effort and routinely starts these runs hours
  # late (measured 3.5-5h here). workflow_dispatch, by contrast, starts within
  # seconds -- so the punctual path is an external cron calling the dispatch
  # API (see README), and these schedules are only a safety net.
  #
  # GitHub cron is UTC; Taiwan is UTC+8. Minute 23 rather than :00, because
  # the top of the hour is when the whole world's schedules pile up.
  schedule:
    - cron: "23 0 * * *"   # 08:23 台北時間
    - cron: "23 8 * * *"   # 16:23 台北時間
  workflow_dispatch:
    inputs:
      always_send:
        description: "沒有變化也寄一封狀態回報"
        type: boolean
        default: true

permissions:
  contents: write

# Two runs writing the snapshot at once would clobber each other.
concurrency:
  group: jellycat-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No dependencies to install: the tracker is standard library only.
      - name: Check for releases
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # Whether to mail a status report even when nothing changed:
          #   - dispatch (by hand or external cron): the always_send input
          #   - morning schedule: yes, unless the repo variable EXTERNAL_TRIGGER
          #     is 'true' -- then the external cron owns the daily report and the
          #     schedules only speak up about real changes, so no duplicates
          #   - evening schedule: only on changes
          ALWAYS_SEND: ${{ ((github.event_name == 'workflow_dispatch' && inputs.always_send) || (github.event.schedule == '23 0 * * *' && vars.EXTERNAL_TRIGGER != 'true')) && '1' || '' }}
        run: python -m src.main

      - name: Commit snapshot
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "No snapshot change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: update catalogue snapshot [skip ci]"
          git push
